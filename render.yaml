envVarGroups:
  - name: bifrost-shared-auth
    envVars:
      - key: BIFROST_API_KEY
        generateValue: true

services:
  - type: web
    name: ai-research-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    healthCheckPath: /
    envVars:
      - key: TAVILY_API_KEY
        sync: false
      - fromGroup: bifrost-shared-auth
      - key: BIFROST_HOST
        sync: false

  - type: web
    name: bifrost-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.bifrost
    healthCheckPath: /health
    envVars:
      - fromGroup: bifrost-shared-auth
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BIFROST_ADMIN_USERNAME
        value: bifrost-admin
      - key: BIFROST_ADMIN_PASSWORD
        generateValue: true
      - key: BIFROST_SETUP_TOKEN
        generateValue: true
      - key: BIFROST_ENCRYPTION_KEY
        generateValue: true