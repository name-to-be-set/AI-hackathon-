services:
  - type: web
    name: ai-research-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODELS
        value: openai/gpt-oss-20b,llama-3.3-70b-versatile,openai/gpt-oss-120b,llama-3.1-8b-instant
      - key: GEMINI_MODELS
        value: gemini-2.5-flash,gemini-2.5-flash-lite
      - key: BIFROST_BASE_URL
        sync: false   # leave empty on Render unless Bifrost is hosted
      - key: BIFROST_API_KEY
        sync: false