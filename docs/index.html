<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VYOM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #0e0f13; --fg: #e8eaed; --dim: rgba(255,255,255,.55);
  --soft: rgba(255,255,255,.07); --line: rgba(255,255,255,.14); --glow: rgba(160,170,255,.22);
}
@media (prefers-color-scheme: light) {
  :root { --bg: #ffffff; --fg: #111827; --dim: rgba(0,0,0,.55);
          --soft: rgba(0,0,0,.05); --line: rgba(0,0,0,.14); --glow: rgba(110,120,255,.2); }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(60rem 40rem at 50% -10%, var(--glow), transparent 60%), var(--bg);
  color: var(--fg); font-family: "DM Sans", system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center; padding: 1.25rem;
}
main { width: 100%; max-width: 30rem; text-align: center; }
h1 {
  font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 700;
  font-size: clamp(2.6rem, 10vw, 3.6rem); letter-spacing: .18em; text-transform: uppercase;
  margin: 0 0 .4rem; animation: rise .8s ease both;
}
.sub { color: var(--dim); margin: 0 0 1.6rem; animation: rise .8s .1s ease both; }

/* a small glimpse of the chat */
.chat { text-align: left; display: grid; gap: .7rem; margin-bottom: 1.6rem; }
.me {
  justify-self: end; max-width: 80%; padding: .6rem .9rem; border: 1px solid var(--line);
  background: var(--soft); border-radius: 1.1rem 1.1rem .25rem 1.1rem; font-size: .95rem;
  animation: rise .7s .3s ease both;
}
.bot { display: grid; gap: .45rem; animation: rise .7s .7s ease both; }
.bot i {
  display: block; height: .7rem; border-radius: .4rem; width: 100%;
  background: linear-gradient(90deg, var(--soft) 20%, var(--line) 50%, var(--soft) 80%);
  background-size: 200% 100%; animation: shimmer 1.6s linear infinite;
}
.bot i:nth-child(2) { width: 88%; } .bot i:nth-child(3) { width: 64%; }

.status { display: flex; align-items: center; justify-content: center; gap: .6rem; color: var(--dim); font-size: .95rem; }
.dots { display: inline-flex; gap: 4px; }
.dots span { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: bounce 1.2s infinite ease-in-out; }
.dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
.bar { height: 3px; border-radius: 3px; background: var(--soft); margin: 1.1rem auto 1rem; overflow: hidden; max-width: 16rem; }
.bar b { display: block; height: 100%; width: 40%; background: var(--fg); border-radius: 3px; animation: slide 1.6s ease-in-out infinite; }
a.open {
  display: inline-block; margin-top: .4rem; padding: .55rem 1.1rem; border: 1px solid var(--line);
  border-radius: 999px; color: var(--fg); text-decoration: none; font-size: .9rem; background: var(--soft);
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes bounce { 0%,80%,100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
@keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(300%); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Vyom</h1>
  <p class="sub">Your AI research assistant</p>

  <div class="chat" aria-hidden="true">
    <div class="me">Explain how AI agents work</div>
    <div class="bot"><i></i><i></i><i></i></div>
  </div>

  <div class="status"><span class="dots"><span></span><span></span><span></span></span><span id="msg">Waking up VYOM…</span></div>
  <div class="bar"><b></b></div>
  <a class="open" id="open" href="#">Open VYOM now</a>
</main>

<script>
  // Change this if your app address changes.
  const APP = "https://ai-research-assistant-sw7p.onrender.com";
  const MIN_SHOW_MS = 1500;     // always show the animation at least this long
  const MAX_WAIT_MS = 60000;    // after this, open the app anyway

  document.getElementById("open").href = APP;
  const started = Date.now();
  let finished = false;

  const go = (text) => {
    if (finished) return;
    finished = true;
    document.getElementById("msg").textContent = text;
    const wait = Math.max(0, MIN_SHOW_MS - (Date.now() - started));
    setTimeout(() => { window.location.href = APP; }, wait + 400);
  };

  const ping = async () => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      // "no-cors" can't read the answer, but it succeeds as soon as the server replies.
      await fetch(APP + "/_stcore/health?t=" + Date.now(), { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
      return true;
    } catch (e) {
      return false;
    } finally {
      clearTimeout(timer);
    }
  };

  (async () => {
    while (!finished) {
      if (await ping()) { go("Ready!"); break; }
      if (Date.now() - started > MAX_WAIT_MS) { go("Opening…"); break; }
      await new Promise(r => setTimeout(r, 2500));
    }
  })();
</script>
</body>
</html>
